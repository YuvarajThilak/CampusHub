
name: campushub
description: A complete student super app for academics, campus life, collaboration and more.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core / Platform
  cupertino_icons: ^1.0.8

  # UI / Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0

  # State Management / Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0

  # Backend / Environment
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1

  # Charts / Date / QR
  fl_chart: ^0.70.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0

  # Files / Images
  image_picker: ^1.2.3
  file_picker: ^13.1.0

  # Network / Links / Image Cache
  http: ^1.6.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

  # Campus Life / Sharing
  gal: ^2.3.3
  share_plus: ^13.3.1

  # Archive / File Handling
  archive: ^4.3.0

  # Local Storage
  shared_preferences: ^2.5.5

  # Local Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.1

  # Permissions
  permission_handler: ^12.0.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

# Launcher icon generation
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

# Compatibility fix for the launcher icon generator
dependency_overrides:
  archive: ^4.4.0
